name: "Debug with ssh"
description: "This GitHub Action enables direct interaction with the host system running your GitHub Actions via SSH"
author: "Owen Ou"
branding:
  icon: "terminal"
  color: "purple"
runs:
  using: "node24"
  main: "lib/index.js"
  post: "lib/index.js"
  post-if: "!cancelled()"
inputs:
  limit-access-to-actor:
    description: "If only the public SSH keys of the user triggering the workflow (and, on a re-run, of whoever re-ran it) should be authorized. Bot accounts such as dependabot[bot] have no SSH keys and are skipped; if that leaves no one to authorize, no session is started"
    required: false
    default: "false"
  limit-access-to-users:
    description: "If only the public SSH keys of the listed GitHub users should be authorized"
    required: false
    default: ""
  upterm-server:
    description: "upterm server address (required), supported protocols are ssh, ws, or wss."
    required: true
    default: "ssh://uptermd.upterm.dev:22"
  known-hosts:
    description: "known_hosts entry for the upterm server, pinning its host key. Required when upterm-server is not the default. The default server's key is bundled with the action. A relay that presents a host certificate is verified by an '@cert-authority <host> <type> <key>' line; from upterm v0.38.0, a plain line holding the relay's own key also works."
    required: false
    default: ""
  wait-timeout-minutes:
    description: "Integer number of minutes to wait for a guest to join before upterm ends the session. Attached mode: unset or 0 means no timeout. Detached mode: counted from when all regular steps finish; unset or 0 means 10. Once a guest has joined, the session stays up until it ends."
    required: false
    default: ""
  upterm-version:
    description: "Upterm version/tag to install (e.g., v0.32.0). Requires v0.32.0 or newer. Defaults to latest when unset."
    required: false
  upterm-repository:
    description: "GitHub repository (OWNER/NAME) to download upterm's release from, for a fork's build. Defaults to owenthereal/upterm. upterm-version names the release in it."
    required: false
    default: ""
  allow-exec:
    description: "If true, guests may run commands without a terminal (ssh <ssh-command target> 'cmd'), each through $SHELL -c in a process of its own with the runner's access, getting its output and exit status back: what scripts and AI agents need, since they can't drive a shared terminal. Needs an upterm with --allow-exec (see upterm-repository). Not on Windows runners."
    required: false
    default: "false"
  ssh-command-status:
    description: "If true, publish the session's ssh command as a commit status (on the pull request's head commit, for a pull_request event), so that a program -- an AI agent, a script -- can read it while the job runs: GitHub serves the job's log only once the job has finished. Needs `permissions: statuses: write`; without it the step fails before starting a session. Marked ended when the post step stops the session."
    required: false
    default: "false"
  ssh-command-status-context:
    description: "The commit status's context (its name) for ssh-command-status. Defaults to 'upterm / <job id>'; set it per matrix entry, whose jobs share an id."
    required: false
    default: ""
  detached:
    description: "In detached mode, the workflow job will continue while the upterm session is active"
    required: false
    default: "false"
  inherit-path:
    description: "If true, the session hosts a bash that reads none of the system's or user's startup files (/bin/bash --noprofile --rcfile <the action's> -i), so the guest's shell keeps this step's PATH instead of having /etc/profile, ~/.bashrc or a container's init reset it. That shell restarts when it exits, so exit and Ctrl-D don't end the session; end-session does. The action's rc file prints how to leave, continue or end, and defines end-session. If false, upterm hosts $SHELL. Ignored on Windows, and when default-shell is set."
    required: false
    default: "true"
  default-shell:
    description: "Absolute path to the shell the session hosts. Use this when your container has a wrapper shell that sets up the real environment (e.g. /opt/env/bin/bash). Takes precedence over inherit-path."
    required: false
    default: ""
  github-token:
    description: "Token used on GitHub Enterprise Server to fetch the SSH keys of the users limit-access-to-actor and limit-access-to-users authorize, through the instance's API. Unused on github.com."
    required: false
    default: ${{ github.token }}
outputs:
  ssh-command:
    description: "The SSH command to connect to the upterm session (e.g., 'ssh session:token@uptermd.upterm.dev')"
  join-command:
    description: "The upterm join command to connect to the upterm session (e.g., 'upterm join ssh://session:token@uptermd.upterm.dev'). Empty with upterm before v0.38.0, or a ws/wss server behind a path"
